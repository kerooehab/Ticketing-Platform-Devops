<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevOps Platform Frontend</title>
</head>
<body>
    <h1>Welcome to the DevOps Production Lab</h1>
    <p>Status: <span id="status">Loading...</span></p>
    <script>
        fetch('/api/health')
            .then(response => response.json())
            .then(data => {
                document.getElementById('status').innerText = data.status;
            })
            .catch(err => {
                document.getElementById('status').innerText = 'Backend Unreachable';
            });
    </script>
</body>
</html>
