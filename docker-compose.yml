version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  backend:
    build: ./backend
    container_name: backend-service
    environment:
      - PORT=5000
      - DATABASE_HOST=database
    ports:
      - "5000:5000"
    depends_on:
      - database
    restart: always

  frontend:
    build: ./frontend
    container_name: frontend-service
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
